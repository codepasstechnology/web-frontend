name: Auto PR dev → main

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Create PR if none exists
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          count=$(gh pr list --repo ${{ github.repository }} --base main --head dev --state open --json number --jq length)
          echo "Open PRs from dev → main: $count"
          if [ "$count" -eq 0 ]; then
            gh pr create \
              --repo ${{ github.repository }} \
              --base main \
              --head dev \
              --title "dev → main" \
              --body "Ongoing integration PR. Push to \`dev\` to update; merge when ready to release."
            echo "PR created."
          else
            echo "PR already exists, nothing to do."
          fi
