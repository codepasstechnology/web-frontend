name: Web Frontend CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  eslint-prettier-tsc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npx prettier --check .

      - name: Type check
        run: npx tsc --noEmit

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Create cPanel env
        run: printf 'VITE_API_URL=\nVITE_CPANEL=true\n' > .env.cpanel

      - name: Build (cPanel)
        run: npm run build:cpanel
