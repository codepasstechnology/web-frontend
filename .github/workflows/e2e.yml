name: Full user journey

on:
  workflow_call:
    secrets:
      E2E_REPO_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8000
      FRONTEND_URL: http://localhost:4173
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/backend/database/e2e.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      LOG_CHANNEL: single
      VITE_API_URL: http://127.0.0.1:8000/api
      E2E_BACKEND_DIR: ${{ github.workspace }}/backend
    steps:
      - name: Check repository access token
        env:
          REPO_TOKEN: ${{ secrets.E2E_REPO_TOKEN }}
        run: test -n "$REPO_TOKEN" || { echo "::error::Set E2E_REPO_TOKEN with read access to both private repositories."; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: codepasstechnology/web-frontend
          ref: ${{ github.repository == 'codepasstechnology/web-frontend' && github.sha || 'main' }}
          path: web-frontend
          token: ${{ secrets.E2E_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: codepasstechnology/backend
          ref: ${{ github.repository == 'codepasstechnology/backend' && github.sha || 'main' }}
          path: backend
          token: ${{ secrets.E2E_REPO_TOKEN }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, fileinfo, openssl, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json
      - name: Prepare disposable backend
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          touch database/e2e.sqlite
          php artisan key:generate
          php ../web-frontend/e2e/support/prepare-backend.php
      - name: Build marketplace and install browser
        working-directory: web-frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build:cpanel
      - name: Start isolated API
        run: |
          php -d display_errors=0 -S 127.0.0.1:8000 web-frontend/e2e/support/backend-router.php > backend/storage/logs/e2e-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/plans > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::E2E backend did not start."
          exit 1
      - name: Run signup, verification, login, listing and approval journey
        working-directory: web-frontend
        run: npx playwright test --config playwright.journey.config.ts
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-journey-report
          path: |
            web-frontend/playwright-report/
            web-frontend/test-results/
          retention-days: 7
