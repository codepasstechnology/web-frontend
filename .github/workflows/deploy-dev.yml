name: Deploy dev to server

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create cPanel env
        run: printf 'VITE_API_URL=https://api.codepasstech.top/api\nVITE_CPANEL=true\n' > .env.cpanel

      - name: Build (cPanel)
        run: npm run build:cpanel

      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust host key
        run: ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Sync build to server
        run: |
          rsync -az --delete \
            dist-cpanel/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/landconnect.codepasstech.top/public_html/
